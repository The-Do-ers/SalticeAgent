<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Rocket Follower</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .rocket {
            position: absolute;
            width: 80px;
            height: 120px;
            transform-origin: center bottom;
            transition: transform 0.1s ease-out;
        }

        .rocket-svg {
            width: 100%;
            height: 100%;
            fill: #1e293b;
        }

        .flame {
            position: absolute;
            bottom: -20px;
            left: 50%;
            width: 20px;
            height: 30px;
            background: radial-gradient(circle, #f59e0b, #ea580c, transparent);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform: translateX(-50%);
            animation: flame-pulse 0.5s infinite alternate;
        }

        @keyframes flame-pulse {
            0% {
                transform: translateX(-50%) scaleY(1);
            }
            100% {
                transform: translateX(-50%) scaleY(1.2);
            }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(245, 158, 11, 0.8);
            border-radius: 50%;
            animation: particle-fade 1s forwards;
        }

        @keyframes particle-fade {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.5);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="rocket" id="rocket">
            <path class="rocket-svg" d="M40,0 L40,80 L30,120 L50,120 L60,80 L60,0 Z" />
        </svg>
        <div class="flame"></div>
        <div class="particles" id="particles"></div>
    </div>

    <script>
        const rocket = document.getElementById('rocket');
        const particles = document.getElementById('particles');
        let mouseX = 0;
        let mouseY = 0;
        let rocketX = 0;
        let rocketY = 0;
        let velocityX = 0;
        let velocityY = 0;
        const spring = 0.1;
        const friction = 0.8;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function updateRocket() {
            // Calculate spring force
            const dx = mouseX - rocketX;
            const dy = mouseY - rocketY;
            velocityX += dx * spring;
            velocityY += dy * spring;

            // Apply friction
            velocityX *= friction;
            velocityY *= friction;

            // Update position
            rocketX += velocityX;
            rocketY += velocityY;

            // Update rocket position and rotation
            rocket.style.left = `${rocketX - 40}px`;
            rocket.style.top = `${rocketY - 60}px`;
            rocket.style.transform = `rotate(${velocityX * 2}deg)`;

            // Create particles
            if (Math.random() < 0.3) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${rocketX - 4}px`;
                particle.style.top = `${rocketY + 60}px`;
                particles.appendChild(particle);

                // Remove particle after animation
                setTimeout(() => {
                    particles.removeChild(particle);
                }, 1000);
            }

            requestAnimationFrame(updateRocket);
        }

        updateRocket();
    </script>
</body>
</html>
