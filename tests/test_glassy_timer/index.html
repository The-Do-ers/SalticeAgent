<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassy Countdown Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #0f172a 50%, #030712 100%);
      color: #f8fafc;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(18, 24, 38, 0.65);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.125);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border-radius: 16px;
    }
    .neon-glow-cyan {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.5), inset 0 0 15px rgba(6, 182, 212, 0.2);
      border-color: rgba(6, 182, 212, 0.8);
    }
    .neon-glow-purple {
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5), inset 0 0 15px rgba(168, 85, 247, 0.2);
      border-color: rgba(168, 85, 247, 0.8);
    }
    .timer-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.7);
    }
    .control-button {
      transition: all 0.3s ease;
    }
    .control-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="flex items-center justify-center p-4">
  <div class="glass-panel p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-center mb-6">Glassy Countdown</h1>
    <div class="timer-display text-center mb-8" id="timer">00:00:00</div>
    <div class="grid grid-cols-3 gap-4">
      <button class="control-button glass-panel py-3 px-4 neon-glow-cyan" id="start">Start</button>
      <button class="control-button glass-panel py-3 px-4 neon-glow-purple" id="pause">Pause</button>
      <button class="control-button glass-panel py-3 px-4 neon-glow-cyan" id="reset">Reset</button>
    </div>
    <div class="mt-6">
      <input type="number" class="glass-panel w-full p-3 text-center" id="minutes" placeholder="Enter minutes" min="0">
    </div>
  </div>

  <script>
    let timer;
    let timeLeft = 0;
    let isRunning = false;

    const timerDisplay = document.getElementById('timer');
    const startButton = document.getElementById('start');
    const pauseButton = document.getElementById('pause');
    const resetButton = document.getElementById('reset');
    const minutesInput = document.getElementById('minutes');

    function formatTime(seconds) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      return [
        hrs.toString().padStart(2, '0'),
        mins.toString().padStart(2, '0'),
        secs.toString().padStart(2, '0')
      ].join(':');
    }

    function updateDisplay() {
      timerDisplay.textContent = formatTime(timeLeft);
    }

    function startTimer() {
      if (isRunning) return;
      if (timeLeft <= 0) return;

      isRunning = true;
      timer = setInterval(() => {
        timeLeft--;
        updateDisplay();
        if (timeLeft <= 0) {
          clearInterval(timer);
          isRunning = false;
          alert('Time is up!');
        }
      }, 1000);
    }

    function pauseTimer() {
      if (!isRunning) return;
      clearInterval(timer);
      isRunning = false;
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = 0;
      updateDisplay();
    }

    startButton.addEventListener('click', () => {
      if (minutesInput.value) {
        timeLeft = parseInt(minutesInput.value) * 60;
        updateDisplay();
      }
      startTimer();
    });

    pauseButton.addEventListener('click', pauseTimer);
    resetButton.addEventListener('click', resetTimer);

    // Initialize display
    updateDisplay();
  </script>
</body>
</html>
